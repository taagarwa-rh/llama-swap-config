macros:
  "latest-llama": |
    llama-server \
      --port ${PORT} \
      --jinja \
      -b 4096 \
      -ub 1024 \
      -t 10 \
      -fa on \
      --fit on

models:
  # Large LLMs
  gpt-oss-20b:
    cmd: |
      ${latest-llama} -hf unsloth/gpt-oss-20b-GGUF:F16 \
        -ngl 99 \
        --ctx-size 65536 \
        --temp 1.0 \
        --top-p 1.0 \
        --top-k 0
    ttl: 1800
    aliases:
      - "gpt-oss:20b"
  qwen3.6-35b-coder:
    cmd: |
      ${latest-llama} -hf unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_XL \
        --ctx-size 131072 \
        --temp 0.6 \
        --top-p 0.95 \
        --top-k 20 \
        --min-p 0.00
    ttl: 1800
  qwen3.5-35b-coder:
    cmd: |
      ${latest-llama} -hf unsloth/Qwen3.5-35B-A3B-GGUF:MXFP4_MOE \
        --cache-type-k bf16 \
        --cache-type-v bf16 \
        --ctx-size 131072 \
        --temp 0.6 \
        --top-p 0.95 \
        --top-k 20 \
        --min-p 0.00
    ttl: 1800
  qwen3.5-27b-coder:
    cmd: |
      ${latest-llama} -hf unsloth/Qwen3.5-27B-GGUF:UD-Q4_K_XL \
        --cache-type-k bf16 \
        --cache-type-v bf16 \
        --ctx-size 131072 \
        --temp 0.6 \
        --top-p 0.95 \
        --top-k 20 \
        --min-p 0.00
    ttl: 1800
  qwen3-30b:
    cmd: ${latest-llama} -hf unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF:Q4_K_M
    ttl: 1800
    aliases:
      - "qwen3:30b"
  qwen3-4b:
    cmd: |
      ${latest-llama} -hf unsloth/Qwen3-4B-Instruct-2507-GGUF:UD-Q4_K_XL \
        --ctx-size 32000
    ttl: 1800
    aliases:
      - "qwen3:4b"
  qwen3-0.6b:
    cmd: |
      ${latest-llama} -hf Qwen/Qwen3-0.6B-GGUF \
        --ctx-size 32000 \
        --reasoning-budget 0
    ttl: 1800
    aliases:
      - "qwen3:0.6b"
  qwen2.5-32b:
    cmd: ${latest-llama} -hf mradermacher/Qwen2.5-32B-GGUF:Q4_K_M
    ttl: 1800

  # Small Code Assist Models (always running)
  qwen2.5-coder-1.5b:
    cmd: ${latest-llama} -hf Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q8_0

  # Embedding Models
  nomic-embed-text-v1.5:
    cmd: |
      ${latest-llama} -hf nomic-ai/nomic-embed-text-v1.5-GGUF:F16 \
        --embeddings \
        -c 8192 \
        -b 8192 \
        --rope-scaling yarn \
        --rope-freq-scale .75
    ttl: 1800

groups:
  # Put all large LLMs here so that only one runs at a time
  "large-llms":
    swap: true
    exclusive: false
    members:
      - "gpt-oss-20b"
      - "qwen3-30b"
      - "qwen3.6-35b-coder"
      - "qwen3.5-35b-coder"
      - "qwen3.5-27b-coder"
      - "qwen2.5-32b"
      - "qwen3-4b"

  # Put small code assist models here so they can always be running
  "code-assist":
    persistent: true
    swap: false
    exclusive: false
    members:
      - "qwen2.5-coder-1.5b"

  # Put embedding models here so they can be loaded as needed
  "embedding":
    swap: false
    exclusive: false
    members:
      - "nomic-embed-text-v1.5"

hooks:
  on_startup:
    # Load code assist models on startup
    preload:
      - "qwen2.5-coder-1.5b"
